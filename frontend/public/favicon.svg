<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b63d6" />
      <stop offset="100%" stop-color="#02459e" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9" />
      <stop offset="35%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle App Icon Background matching media_1790164833309.png -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Electric Purple Lightning Bolt Symbol -->
  <polygon
    points="154,195 225,112 378,112 328,195 435,195 272,399 307,276 195,276"
    fill="url(#boltGrad)"
    filter="url(#glow)"
  />
</svg>